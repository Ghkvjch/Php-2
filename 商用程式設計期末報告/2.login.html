<html>
    <head>
        <meta charset="utf-8" /> <!-- 設定編碼為 UTF-8，支援中文 -->
        <title>登入範例</title> <!-- 瀏覽器分頁標題 -->
    </head>
    <body>
        <!-- 表單：使用 POST 方法送到 2.login.php -->
        <form method=post action="2.login.php">
            帳號：<input type=text name="id"><br /> <!-- 使用者帳號輸入欄位 -->

            <input type=submit value="登入"> <!-- 送出表單 -->
            <input type=reset value="清除"> <!-- 清空輸入 -->
        </form>
    </body>
</html>
